      <rect x="0" y="0" width="136" height="142" rx="18"/><rect x="194" y="0" width="136" height="142" rx="18"/><rect x="388" y="0" width="136" height="142" rx="18"/><rect x="582" y="0" width="136" height="142" rx="18"/><rect x="776" y="0" width="136" height="142" rx="18"/><rect x="970" y="0" width="136" height="142" rx="18"/>
