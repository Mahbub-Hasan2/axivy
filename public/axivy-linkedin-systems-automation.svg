      .headline{font-family:Arial,sans-serif;font-size:60px;font-weight:800;letter-spacing:-1.5px;fill:#f7fbf9}
      .headline2{font-family:Arial,sans-serif;font-size:60px;font-weight:800;letter-spacing:-1.5px;fill:#aeea43}
      .node{font-family:Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;fill:#f8fcf8}
      .micro{font-family:Arial,sans-serif;font-size:18px;font-weight:600;fill:#bbd1c9}
    </style>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
